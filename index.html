    <style>
      /* Label text color variable */
      :root {
        --label: #333;
        --labelSecondary: rgba(60, 60, 67, 0.6);
        --labelTertiary: rgba(60, 60, 67, 0.3);
        --background: white;
        --backgroundSecondary: rgb(240, 240, 240);
        --link: rgb(16, 33, 204);

        /* ngl stolen from GitHub */
        --btn-primary-text: #ffffff;
        --btn-primary-bg: #1f883d;
        --btn-primary-border: rgba(31, 35, 40, 0.15);
        --btn-primary-shadow: 0 1px 0 rgba(31, 35, 40, 0.1);
        --btn-primary-inset-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
        --btn-primary-hover-bg: #1a7f37;
        --btn-primary-hover-border: rgba(31, 35, 40, 0.15);
        --btn-primary-selected-bg: hsla(137, 66%, 28%, 1);
        --btn-primary-selected-shadow: inset 0 1px 0 rgba(0, 45, 17, 0.2);

        /* Grid link pastel colors */
        --grid-link-1-bg: #fff4b3;
        --grid-link-1-hover: #ffe680;
        --grid-link-2-bg: #ffd4a3;
        --grid-link-2-hover: #ffbf7a;
        --grid-link-3-bg: #c8e6c9;
        --grid-link-3-hover: #a5d6a7;
        --grid-link-4-bg: #d7ccc8;
        --grid-link-4-hover: #bcaaa4;
      }

      /* Dark mode */
      @media (prefers-color-scheme: dark) {
        :root {
          --label: white;
          --labelSecondary: rgba(235, 235, 245, 0.6);
          --labelTertiary: rgba(235, 235, 245, 0.3);
          --background: rgb(36, 36, 36);
          --backgroundSecondary: rgb(60, 60, 60);

          --btn-primary-bg: #238636;
          --btn-primary-border: rgba(240, 246, 252, 0.1);
          --btn-primary-shadow: 0 0 transparent;
          --btn-primary-inset-shadow: 0 0 transparent;
          --btn-primary-hover-bg: #2ea043;
          --btn-primary-hover-border: rgba(240, 246, 252, 0.1);
          --btn-primary-selected-bg: #238636;
          --btn-primary-selected-shadow: 0 0 transparent;

          /* Grid link pastel colors for dark mode */
          --grid-link-1-bg: #4d4600;      
          --grid-link-1-hover: #665c00;   
          --grid-link-2-bg: #663e1f;      
          --grid-link-2-hover: #804f26;   
          --grid-link-3-bg: #2e4930;      
          --grid-link-3-hover: #3d6640;   
          --grid-link-4-bg: #3b2f2d;      
          --grid-link-4-hover: #54413d;   
        }
      }

      @font-face {
        font-family: "Virgil";
        src: url("/static/immutable/fonts/Virgil.woff2");
        font-display: fallback;
      }
      *,
      *:before,
      *:after {
        box-sizing: border-box;
      }
      * {
        font-family: "Virgil";
        color: var(--label);
        user-select: none;
        -webkit-touch-callout: none; /* iOS Safari */
        -webkit-user-select: none; /* Safari */
        -khtml-user-select: none; /* Konqueror HTML */
        -moz-user-select: none; /* Old versions of Firefox */
        -ms-user-select: none; /* Internet Explorer/Edge */
      }
      html,
      body {
        background: var(--background);
        margin: 0;
        padding: 0;
        color: var(--label);
      }

      a {
        color: var(--link);
      }

      .social-link {
        color: var(--label);
        text-decoration: none;
        padding: 4px 16px 4px 16px;
        margin-bottom: 12px;
        border-bottom: 1px solid transparent;
      }
      .social-link:hover {
        border-bottom-color: var(--label);
      }

      .grid-link {
        color: var(--label);
        text-decoration: none;
        border: 4px solid var(--label);
        border-top: none;
        font-size: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        transition: background-color 0.2s ease;
      }
      .grid-link:first-child {
        border-top: 4px solid var(--label);
      }
      .grid-link:nth-child(1) {
        background-color: var(--grid-link-1-bg);
      }
      .grid-link:nth-child(1):hover {
        background-color: var(--grid-link-1-hover);
      }
      .grid-link:nth-child(2) {
        background-color: var(--grid-link-2-bg);
      }
      .grid-link:nth-child(2):hover {
        background-color: var(--grid-link-2-hover);
      }
      .grid-link:nth-child(3) {
        background-color: var(--grid-link-3-bg);
      }
      .grid-link:nth-child(3):hover {
        background-color: var(--grid-link-3-hover);
      }
      .grid-link:nth-child(4) {
        background-color: var(--grid-link-4-bg);
      }
      .grid-link:nth-child(4):hover {
        background-color: var(--grid-link-4-hover);
      }

      #more-link {
        border: 1px solid transparent;
        border-radius: 12px;
        padding: 4px 16px 4px 16px;
        display: inline-block;
        transition: none;
        margin-bottom: 12px;
      }
      #more-link:hover {
        border-color: var(--label);
        background: var(--backgroundSecondary);
      }

      @media (max-height: 789px) {
        #copyright {
          display: none;
        }
      }

      .btn.primary {
        cursor: pointer;
        background-color: var(--btn-primary-bg);
        border: solid var(--btn-primary-border);
        border-radius: 8px;
        padding: 8px 16px;
        font-family: sans-serif;
        color: var(--btn-primary-text);
        box-shadow: var(--btn-primary-shadow);
        transition: background-color 0.2s ease-in-out,
          border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        transition: transform 0.8s ease-in-out;
      }

      .btn.primary:hover {
        background-color: var(--btn-primary-hover-bg);
        border-color: var(--btn-primary-hover-border);
      }

      .btn.primary:active {
        background-color: var(--btn-primary-selected-bg);
        border-color: var(--btn-primary-selected-border);
        box-shadow: var(--btn-primary-selected-shadow);
      }

      @keyframes btn-primary-border-pulsate {
        0% {
          border-color: var(--btn-primary-hover-border);
        }
        50% {
          border-color: var(--btn-primary-selected-border);
        }
        100% {
          border-color: var(--btn-primary-hover-border);
        }
      }

      /* Dialog styles */
      #more-dialog::backdrop {
        background: transparent;
      }

      #close-dialog:hover,
      #close-dialog:focus-visible {
        transform: rotate(90deg);
      }
    </style>

    <script>
      // #region Setup
      // Disable saved scroll position as otherwise leads to weird layout on second load
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }
      const h1 = document.querySelector("h1");
      if (!h1) throw new Error("Missing h1");
      // Shorten the name for mobile
      if (window.innerWidth < 700) h1.innerText = "David Adler";
      const callButton = document.getElementById("call");
      if (!callButton) throw new Error("Missing call button");
      const shareRecording = document.getElementById("share_recording");
      if (!shareRecording) throw new Error("Missing share recording");
      const copyright = document.getElementById("copyright");
      copyright.innerHTML = "© " + new Date().getFullYear() + " David Adler";
      copyright.onclick = () =>
        alert(
          `I only put this here so you have a handy way of knowing the current year is ${new Date().getFullYear()}. You hereby have my permission to come back at any time to check what year it is.`
        );

      // #endregion

      // #region Utils
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      // #endregion

      // #region Eye Tracking
      // Each photo is taken with the subject looking in a different direction.
      // The angle (radians) is the direction of gaze, measured from east (0) clockwise.
      // Eye coordinates are used to align photos so the eyes stay centered in the frame.
      const photos = [
        { url: "/static/immutable/webp/0E9A9000.webp", angle: -Math.PI / 2, leftEye: { x: 221.21, y: 248.62 }, rightEye: { x: 306.64, y: 247.35 } },             // N
        { url: "/static/immutable/webp/0E9A9002.webp", angle: -Math.PI / 4, leftEye: { x: 223.12, y: 250.54 }, rightEye: { x: 309.19, y: 249.26 } },             // NE
        { url: "/static/immutable/webp/0E9A9003.webp", angle: -Math.PI / 8, leftEye: { x: 236.51, y: 251.17 }, rightEye: { x: 323.21, y: 249.9 } },              // ENE
        { url: "/static/immutable/webp/0E9A9004.webp", angle: 0, leftEye: { x: 236.51, y: 257.55 }, rightEye: { x: 323.21, y: 255 } },                            // E
        { url: "/static/immutable/webp/0E9A9005.webp", angle: Math.PI / 8, leftEye: { x: 240.97, y: 256.91 }, rightEye: { x: 328.31, y: 255 } },                  // ESE
        { url: "/static/immutable/webp/0E9A9006.webp", angle: Math.PI / 4, leftEye: { x: 231.41, y: 256.27 }, rightEye: { x: 320.02, y: 250.54 } },               // SE
        { url: "/static/immutable/webp/0E9A9008.webp", angle: (3 * Math.PI) / 8, leftEye: { x: 233.32, y: 258.82 }, rightEye: { x: 320.66, y: 256.27 } },        // SSE
        { url: "/static/immutable/webp/0E9A9009.webp", angle: Math.PI / 2, leftEye: { x: 235.87, y: 255.64 }, rightEye: { x: 328.31, y: 252.45 } },               // S
        { url: "/static/immutable/webp/0E9A9012.webp", angle: (5 * Math.PI) / 8, leftEye: { x: 211.65, y: 260.1 }, rightEye: { x: 302.81, y: 257.55 } },         // SSW
        { url: "/static/immutable/webp/0E9A9013.webp", angle: (3 * Math.PI) / 4, leftEye: { x: 214.2, y: 256.27 }, rightEye: { x: 306.64, y: 255 } },            // SW
        { url: "/static/immutable/webp/0E9A9015.webp", angle: (7 * Math.PI) / 8, leftEye: { x: 208.46, y: 251.17 }, rightEye: { x: 303.45, y: 249.9 } },         // WSW
        { url: "/static/immutable/webp/0E9A9017.webp", angle: Math.PI, leftEye: { x: 201.45, y: 252.45 }, rightEye: { x: 291.34, y: 248.62 } },                   // W
        { url: "/static/immutable/webp/0E9A9020.webp", angle: (-3 * Math.PI) / 4, leftEye: { x: 197.62, y: 255 }, rightEye: { x: 290.06, y: 249.26 } },          // NW
        { url: "/static/immutable/webp/0E9A9019.webp", angle: (-5 * Math.PI) / 8, leftEye: { x: 207.82, y: 246.07 }, rightEye: { x: 302.17, y: 240.34 } },       // NNW
      ];

      const hoveredPhoto = {
        url: "/static/immutable/webp/0E9A8952_hovered.webp",
        leftEye: { x: 207.83, y: 249.9 },
        rightEye: { x: 297.71, y: 246.08 },
      };
      const clickedPhoto = {
        url: "/static/immutable/webp/0E9A8956_clicked.webp",
        leftEye: { x: 203.36, y: 260.1 },
        rightEye: { x: 297.71, y: 260.74 },
      };
      const balloonPhotoUrl = "/static/immutable/resized/IMG_7981.png";

      // The width of the frame of the photo
      const frameWidth = Math.min(460, window.innerWidth - 100);
      // The width of the photo inside the frame must be bigger as it will need to be offset to align eyes
      const scaledPhotoWidth = frameWidth + 40;
      const frameHeight = frameWidth * 1.1;
      const image = document.getElementById("image");
      if (!image) {
        throw new Error("Missing image");
      }
      // Don't show a dialog to download the image on iPhone long press
      image.oncontextmenu = (e) => e.preventDefault();
      const frame = image.parentElement;
      if (!frame) {
        throw new Error("Missing frame");
      }

      frame.style.width = `${frameWidth}px`;
      frame.style.height = `${frameHeight}px`;

      // Preload all images after the first one has loaded
      const preloadImage = (url) =>
        new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve();
          img.onerror = (e) => reject(e);
          img.src = url;
        });
      let hasLoadedAllImages = false;
      const preloadImages = async () => {
        if (hasLoadedAllImages) return;
        hasLoadedAllImages = true;

        await Promise.all(
          [...photos, hoveredPhoto, clickedPhoto].map(async (photo) => {
            try {
              await preloadImage(photo.url);
            } catch (e) {
              // Ignore
            }
          })
        );
        await preloadImage(balloonPhotoUrl);
      };
      if (image.complete) {
        preloadImages();
      }
      image.addEventListener("load", preloadImages);

      const eyesRelativePosition = { x: frameWidth / 2, y: frameWidth / 2 };

      let eyesAbsolutePosition = null;
      function getEyesAbsolutePosition() {
        if (!eyesAbsolutePosition) {
          // Avoid layout thrashing
          const frameRect = frame.getBoundingClientRect();
          eyesAbsolutePosition = {
            x: frameRect.left + eyesRelativePosition.x,
            y: frameRect.top + eyesRelativePosition.y,
          };
        }
        return eyesAbsolutePosition;
      }

      function distance(point1, point2) {
        const x = point1.x - point2.x;
        const y = point1.y - point2.y;
        return Math.sqrt(x * x + y * y);
      }

      function isInCentralPortionOfFace(x, y) {
        const frameAbsoluteCenter = getEyesAbsolutePosition();
        return distance({ x, y }, frameAbsoluteCenter) < 60;
      }

      let lastTimeEnteredFace = 0;
      let timeoutIdHoveredFace = 0;

      /** @param {MouseEvent | TouchEvent} e */
      function handleMouseMove(e) {
        // get touch or mouse position
        const x = "clientX" in e ? e.clientX : e.touches[0].clientX;
        const y = "clientY" in e ? e.clientY : e.touches[0].clientY;

        const center = getEyesAbsolutePosition();
        const mouseAngle = Math.atan2(y - center.y, x - center.x);

        // Find the photo whose gaze direction is closest to the mouse angle
        const angleDist = (a, b) => Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b)));
        let closestPhoto = photos.reduce((a, b) =>
          angleDist(mouseAngle, a.angle) <= angleDist(mouseAngle, b.angle) ? a : b
        );

        // Delay showing the hovered face to avoid jank during quick swipes
        if (isInCentralPortionOfFace(x, y)) {
          if (lastTimeEnteredFace === 0) {
            lastTimeEnteredFace = Date.now();
            timeoutIdHoveredFace = setTimeout(() => handleMouseMove(e), 150);
          } else if (Date.now() - lastTimeEnteredFace > 150) {
            closestPhoto = hoveredPhoto;
          }
        } else {
          lastTimeEnteredFace = 0;
          clearTimeout(timeoutIdHoveredFace);
        }

        if (!closestPhoto) {
          throw new Error("Missing closest photo");
        }

        // set image to closest photo
        image.width = scaledPhotoWidth;
        // This is a hardcoded value all the photos have this width
        const naturalWidth = 510;
        // We want to align the center of the eyes to the center of the frame
        const ratio = scaledPhotoWidth / naturalWidth;
        const naturalRightEyeCoords = closestPhoto.rightEye;
        const naturalLeftEyeCoords = closestPhoto.leftEye;
        const naturalCenter = {
          x: (naturalRightEyeCoords.x + naturalLeftEyeCoords.x) / 2,
          y: (naturalRightEyeCoords.y + naturalLeftEyeCoords.y) / 2,
        };
        // Now that we have the natural center we need to scale it down to the target size
        const scaledCenter = {
          x: naturalCenter.x * ratio,
          y: naturalCenter.y * ratio,
        };

        // Now we can work out the offset we need to apply to the image to align the eyes
        const offset = {
          x: eyesRelativePosition.x - scaledCenter.x,
          y: eyesRelativePosition.y - scaledCenter.y,
        };

        image.src = closestPhoto.url;
        // Avoid shifting the image before it's loaded as otherwise it will shift the eyes of the old image
        image.onload = () => {
          image.style.transform = `translate(${offset.x}px, ${offset.y}px)`;
        };
        if (image.complete) {
          image.onload();
        }
      }

      function handleOnResize() {
        // Clear the cached eyes absolute center
        eyesAbsolutePosition = null;

        // If the last href and the h1 are all in the viewport then we can block scrolling
        // to make for a better experience on mobile
        const lastHref = document.querySelector("a:last-of-type");
        if (!lastHref || !h1) {
          console.warn("Missing last href or h1");
        }
        const lastHrefRect = lastHref.getBoundingClientRect();
        const h1Rect = h1.getBoundingClientRect();
        const lastHrefInViewport =
          lastHrefRect.top >= 0 &&
          lastHrefRect.left >= 0 &&
          lastHrefRect.bottom <= window.innerHeight &&
          lastHrefRect.right <= window.innerWidth;
        const h1InViewport =
          h1Rect.top >= 0 &&
          h1Rect.left >= 0 &&
          h1Rect.bottom <= window.innerHeight &&
          h1Rect.right <= window.innerWidth;
        if (lastHrefInViewport && h1InViewport) {
          document.body.style.overflow = "hidden";
        } else {
          document.body.style.overflow = "auto";
        }
      }

      /** @param {MouseEvent} e */
      function handleClick(e) {
        // If we click and we're in the central portion of the face then show the clicked photo
        const x = e.clientX;
        const y = e.clientY;
        if (isInCentralPortionOfFace(x, y)) {
          image.src = clickedPhoto.url;
          performBalloonAnimation();
          toggleCallButton();
        }
      }

      document.addEventListener("click", handleClick);
      window.addEventListener("mousemove", handleMouseMove);
      window.addEventListener("touchstart", handleMouseMove);
      window.addEventListener("touchmove", handleMouseMove);
      window.addEventListener("resize", handleOnResize);

      // Fake a mouse move to the north west of the screen to start
      handleMouseMove({ clientX: 0, clientY: 0 });
      // Fake a resize to start
      handleOnResize();
      // #endregion

      // #region Call David

      let isCallButtonShown = false;
      let call = undefined;
      function toggleCallButton() {
        if (!isCallButtonShown) {
          isCallButtonShown = true;
          callButton.parentElement.style.marginTop = frameHeight / 28 + "px";
          callButton.style.transform = "scale(1)";
          callButton.style.pointerEvents = "";
          callButton.onclick = () => {
            if (call) {
              return;
            }
            call = callDavid();
            callButton.style.animation =
              "btn-primary-border-pulsate 2.5s infinite";
            let recording = undefined;
            call.onDisconnect = async () => {
              callButton.style.animation = "";
              callButton.style.transform = "scale(0)";
              callButton.style.pointerEvents = "none";
              call = undefined;
              await sleep(1000); // Wait for the call button animation to finish
              callButton.innerHTML = "Turn Sound On";
              isCallButtonShown = false;
              if (recording) {
                displayShareRecordingMessage(recording);
              }
            };

            // Disable recording as it's not working well
            // recordCall()
            //   .then((x) => (recording = x))
            //   .catch((e) => console.error('Error recording call', e))

            call?.start();
          };
        }
      }

      async function recordCall() {
        const stream = await navigator.mediaDevices
          .getUserMedia({ audio: true, video: true })
          .catch((error) => console.log(`Error getting user media: ${error}`));
        if (!stream) return;
        let options;
        if (MediaRecorder.isTypeSupported("video/mp4")) {
          options = {
            mimeType: "video/mp4",
            videoBitsPerSecond: 500000,
            audioBitsPerSecond: 64000,
          };
        } else if (MediaRecorder.isTypeSupported("video/webm; codecs=vp9")) {
          options = { mimeType: "video/webm; codecs=vp9" };
        } else if (MediaRecorder.isTypeSupported("video/webm")) {
          options = { mimeType: "video/webm" };
        } else {
          console.error("No suitable mimetype found for this device");
        }

        const mediaRecorder = new MediaRecorder(stream, options);

        const chunks = [];
        mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
        mediaRecorder.start(1000);
        return {
          download: () => {
            mediaRecorder.stop();
            const blob = new Blob(chunks, { type: options.mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `call_with_david.${options.mimeType.split("/")[1]}`;
            a.click();
          },
        };
      }

      async function displayShareRecordingMessage(recording) {
        // Display the share recording message
        shareRecording.style.transform = "scale(1)";
        shareRecording.innerHTML = /*html*/ `Thanks for calling!
                  I would love to see the recording of the call, to share it with me
                  <a id="share_download_video" href='#'>first download the video</a>
                  and then <a id="share_send_email">send me an email</a> with the video attached.
                  Or just <a id="close_share_recording" href="#">close this message</a>.`;
        const downloadVideo = document.getElementById("share_download_video");
        if (!downloadVideo) throw new Error("Missing download video");
        downloadVideo.onclick = (e) => {
          e.preventDefault();
          recording.download();
        };
        const sendEmail = document.getElementById("share_send_email");
        if (!sendEmail) throw new Error("Missing send email");
        sendEmail.target = "_blank";
        sendEmail.href = `mailto:hiredavidadler@gmail.com?subject=${encodeURIComponent(
          "Call With David Adler"
        )}&body=${encodeURIComponent(
          "Hey,\n\nThanks for taking the time to play with my website 😊. Please remember to attach the video recording!\n"
        )}`;
        const closeShareRecording = document.getElementById(
          "close_share_recording"
        );
        if (!closeShareRecording)
          throw new Error("Missing close share recording");
        closeShareRecording.onclick = (e) => {
          e.preventDefault();
          shareRecording.style.transform = "scale(0)";
        };
      }

      function callDavid() {
        let state = "disconnected";
        const ringtone = new Audio();
        ringtone.src = "/static/immutable/audio/compressed/ringing.mp3";
        ringtone.loop = true;
        const response = new Audio();
        response.src = "/static/immutable/audio/compressed/response.mp3";
        let ringtoneDurationTimeoutId = 0;
        let ringtoneDelayTimeoutId = 0;

        let onDisconnect = () => {};

        const start = () => {
          state = "connecting";
          callButton.innerText = "Calling...";
          ringtoneDelayTimeoutId = setTimeout(() => {
            try {
              ringtone.play();
              ringtoneDurationTimeoutId = setTimeout(() => {
                try {
                  state = "connected";
                  ringtone.pause();
                  callButton.innerText = "Connected";
                  response.onended = () => {
                    state = "disconnected";
                    onDisconnect();
                  };
                  response.play();
                } catch (e) {
                  console.error("Error playing response", e);
                }
              }, 7000);
            } catch (e) {
              console.error("Error playing ringtone", e);
            }
          }, 500);
        };

        return {
          disconnect: () => {
            ringtone.pause();
            response.pause();
            clearTimeout(ringtoneDelayTimeoutId);
            clearTimeout(ringtoneDurationTimeoutId);
            onDisconnect();
          },
          start,
          get state() {
            return state;
          },
          set onDisconnect(callback) {
            onDisconnect = callback;
          },
          get isConnected() {
            return state === "connected";
          },
        };
      }

      // #region Balloon Animation
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const balloonImage = new Image();
      let balloons = [];
      let isBalloonAnimationRunning = false;
      let lastFrameTime = 0;

      // Track the pointer so swiping through a balloon pops it. iOS cancels pointer
      // events once a swipe starts but keeps sending touchmove, so listen to both
      let pointer = null;
      let lastPointer = null;
      let isPressOnBalloon = false;
      const trackPointer = (e) => (pointer = { x: e.clientX, y: e.clientY });
      window.addEventListener("pointermove", trackPointer);
      window.addEventListener("touchmove", (e) => trackPointer(e.touches[0]));
      window.addEventListener("pointerdown", (e) => {
        trackPointer(e);
        lastPointer = null;
        isPressOnBalloon = balloons.some((b) => !b.popped && distance(b, pointer) < b.r);
      });
      // Tapping a balloon that floats over a link pops it without following the link
      window.addEventListener("click", (e) => {
        if (!isPressOnBalloon || !e.target.closest("a, button")) return;
        e.preventDefault();
        e.stopPropagation();
      }, true);

      function distanceToSegment(p, a, b) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / (dx * dx + dy * dy || 1)));
        return distance(p, { x: a.x + t * dx, y: a.y + t * dy });
      }

      // x and y are the center, velocities are px per 60fps frame with y pointing down
      class Balloon {
        constructor(x, y, width, vx, vy) {
          this.x = x;
          this.y = y;
          this.width = width;
          this.r = width * 0.55;
          this.vx = vx;
          this.vy = vy;
          // Smaller balloons have less lift relative to their drag so they rise slower.
          // Lift scales with the distance to travel (screen plus ~200px of launch and exit)
          // so balloons take as long to cross a tall screen as a short one
          this.lift = (0.06 + Math.random() * 0.05) * Math.sqrt(width / 75) * ((canvas.height + 200) / 1000);
          this.phase = Math.random() * 7;
          this.angle = 0;
          this.spin = 0;
          this.popped = 0;
        }

        update(dt, time) {
          if (this.popped) return (this.popped += dt);
          // Buoyancy, a gentle breeze and air drag which caps the speed
          this.vy += (-this.lift - this.vy * 0.03) * dt;
          this.vx += (Math.sin(time / 900 + this.phase) * 0.03 - this.vx * 0.03) * dt;
          this.x += this.vx * dt;
          this.y += this.vy * dt;
          // Bounce softly off the sides of the screen
          if (this.x < this.r) this.vx = Math.abs(this.vx) / 2;
          if (this.x > canvas.width - this.r) this.vx = -Math.abs(this.vx) / 2;
          this.x = Math.max(this.r, Math.min(canvas.width - this.r, this.x));
          // Lean into sideways motion with a springy wobble
          this.spin += ((this.vx / 10 - this.angle) / 30 - this.spin / 10) * dt;
          this.angle += this.spin * dt;
        }

        pop() {
          this.popped = 1;
          // Big balloons burst into two smaller ones, small ones just die
          if (this.width > 40) {
            for (const side of [-1, 1]) {
              balloons.push(new Balloon(this.x + (side * this.r) / 2, this.y, this.width * 0.6, this.vx, this.vy));
            }
          }
          // The blast knocks nearby balloons away
          const blastRadius = this.r * 4;
          for (const b of balloons) {
            const d = distance(b, this);
            if (b.popped || !d || d > blastRadius) continue;
            const push = (6 * (1 - d / blastRadius)) / d;
            b.vx += (b.x - this.x) * push;
            b.vy += (b.y - this.y) * push;
          }
        }

        draw() {
          // Popped balloons swell and fade out
          const scale = 1 + this.popped / 10;
          ctx.globalAlpha = Math.max(0, 1 - this.popped / 6);
          ctx.setTransform(scale, 0, 0, scale, this.x, this.y);
          ctx.rotate(this.angle);
          ctx.drawImage(balloonImage, -this.width / 2, -this.width * 0.7, this.width, this.width * 1.4);
        }
      }

      // Balloons bump off each other, bigger ones push smaller ones around more
      function collideBalloons() {
        for (let i = 0; i < balloons.length; i++) {
          for (let j = i + 1; j < balloons.length; j++) {
            const a = balloons[i];
            const b = balloons[j];
            const d = distance(a, b) || 1;
            const overlap = a.r + b.r - d;
            if (overlap <= 0 || a.popped || b.popped) continue;
            const nx = (b.x - a.x) / d;
            const ny = (b.y - a.y) / d;
            // How much of the bump a takes, mass grows with volume
            const share = b.r ** 3 / (a.r ** 3 + b.r ** 3);
            const approach = Math.min(0, (b.vx - a.vx) * nx + (b.vy - a.vy) * ny) * 1.5;
            // Ease overlaps apart over a few frames, snapping them apart at once makes crowds jitter
            const shove = Math.min(overlap / 4, 3);
            a.x -= nx * shove * share;
            a.y -= ny * shove * share;
            a.vx += nx * approach * share;
            a.vy += ny * approach * share;
            b.x += nx * shove * (1 - share);
            b.y += ny * shove * (1 - share);
            b.vx -= nx * approach * (1 - share);
            b.vy -= ny * approach * (1 - share);
          }
        }
      }

      function animationLoop(time) {
        // Step in 60fps frames so 120Hz screens run at the same speed, capped for background tabs
        const dt = Math.min((time - lastFrameTime) / 16.7, 3);
        lastFrameTime = time;
        const hasPointerMoved = pointer !== lastPointer;
        const from = lastPointer || pointer;
        lastPointer = pointer;
        for (const b of balloons.slice()) {
          b.update(dt, time);
          if (hasPointerMoved && !b.popped && distanceToSegment(b, from, pointer) < b.r) b.pop();
        }
        collideBalloons();
        balloons = balloons.filter((b) => b.popped < 6 && b.y + b.width > 0);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        balloons.forEach((b) => b.draw());
        if (!balloons.length) {
          isBalloonAnimationRunning = false;
          return;
        }
        requestAnimationFrame(animationLoop);
      }

      function performBalloonAnimation() {
        balloonImage.src ||= balloonPhotoUrl;
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        // Stop adding balloons once there are enough to fill the screen
        const maxBalloons = (canvas.width * canvas.height) / 5000;
        for (let i = 0; i < canvas.width / 50 && balloons.length < maxBalloons; i++) {
          const width = 50 + Math.random() * 50;
          // Release from just below the screen with a strong upward fling
          const y = canvas.height + width * 0.7 + Math.random() * 100;
          const fling = (-10 - Math.random() * 10) * ((canvas.height + 200) / 1000);
          balloons.push(new Balloon(Math.random() * canvas.width, y, width, Math.random() * 12 - 6, fling));
        }
        if (isBalloonAnimationRunning) return;
        isBalloonAnimationRunning = true;
        lastFrameTime = performance.now();
        lastPointer = pointer;
        requestAnimationFrame(animationLoop);
      }
      // #endregion

      // #region More Dialog
      const moreDialog = document.getElementById("more-dialog");
      const moreLink = document.getElementById("more-link");
      const closeDialogBtn = document.getElementById("close-dialog");

      if (!moreDialog) throw new Error("Missing more dialog");
      if (!moreLink) throw new Error("Missing more link");
      if (!closeDialogBtn) throw new Error("Missing close dialog button");

      const dialogTitle = document.getElementById("dialog-title");
      if (!dialogTitle) throw new Error("Missing dialog title");
      const moreLinkText = document.getElementById("more-link-text");
      if (!moreLinkText) throw new Error("Missing more link text");

      const prefersReducedMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches || false;

      function openDialog() {
        if (!document.startViewTransition || prefersReducedMotion) {
          moreDialog.showModal();
          return;
        }

        moreLink.style.viewTransitionName = "more-box";
        moreLinkText.style.viewTransitionName = "more-text";

        document.startViewTransition(() => {
          moreLink.style.viewTransitionName = "";
          moreLinkText.style.viewTransitionName = "";
          moreDialog.style.viewTransitionName = "more-box";
          dialogTitle.style.viewTransitionName = "more-text";
          moreDialog.showModal();
        });
      }

      function closeDialog() {
        if (!document.startViewTransition || prefersReducedMotion) {
          moreDialog.close();
          return;
        }

        moreDialog.style.viewTransitionName = "more-box";
        dialogTitle.style.viewTransitionName = "more-text";

        document.startViewTransition(() => {
          moreDialog.style.viewTransitionName = "";
          dialogTitle.style.viewTransitionName = "";
          moreLink.style.viewTransitionName = "more-box";
          moreLinkText.style.viewTransitionName = "more-text";
          moreDialog.close();
        });
      }

      moreLink.addEventListener("click", (e) => {
        e.preventDefault();
        openDialog();
      });

      closeDialogBtn.addEventListener("click", () => {
        closeDialog();
      });

      moreDialog.addEventListener("click", (e) => {
        if (e.target === moreDialog) {
          closeDialog();
        }
      });
      // #endregion
    </script>
