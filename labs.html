<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Labs</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/static/favicon/favicon-32x32.png"
    />
    <link
      rel="preload"
      href="/static/immutable/fonts/Virgil.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      :root {
        --label: #333;
        --labelSecondary: rgba(60, 60, 67, 0.6);
        --background: white;
        --card-1: #fff4b3;
        --card-1-hover: #ffe680;
        --card-2: #ffd4a3;
        --card-2-hover: #ffbf7a;
        --card-3: #c8e6c9;
        --card-3-hover: #a5d6a7;
        --card-4: #d7ccc8;
        --card-4-hover: #bcaaa4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --label: white;
          --labelSecondary: rgba(235, 235, 245, 0.6);
          --background: rgb(36, 36, 36);
          --card-1: #4d4600;
          --card-1-hover: #665c00;
          --card-2: #663e1f;
          --card-2-hover: #804f26;
          --card-3: #2e4930;
          --card-3-hover: #3d6640;
          --card-4: #3b2f2d;
          --card-4-hover: #54413d;
        }
      }
      @font-face {
        font-family: "Virgil";
        src: url("/static/immutable/fonts/Virgil.woff2");
        font-display: fallback;
      }
      *,
      *:before,
      *:after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--background);
        color: var(--label);
        font-family: "Virgil", system-ui, sans-serif;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 20px 64px;
      }
      h1 {
        font-size: 40px;
        margin: 0 0 4px;
      }
      .intro {
        color: var(--labelSecondary);
        margin: 0 0 32px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .card {
        display: block;
        height: 100%;
        padding: 20px;
        border: 4px solid var(--label);
        color: var(--label);
        text-decoration: none;
        transition: background-color 0.2s ease;
      }
      .card h2 {
        font-size: 24px;
        margin: 0 0 8px;
      }
      .card p {
        margin: 0;
        color: var(--labelSecondary);
      }
      li:nth-child(4n + 1) .card { background: var(--card-1); }
      li:nth-child(4n + 1) .card:hover { background: var(--card-1-hover); }
      li:nth-child(4n + 2) .card { background: var(--card-2); }
      li:nth-child(4n + 2) .card:hover { background: var(--card-2-hover); }
      li:nth-child(4n + 3) .card { background: var(--card-3); }
      li:nth-child(4n + 3) .card:hover { background: var(--card-3-hover); }
      li:nth-child(4n + 4) .card { background: var(--card-4); }
      li:nth-child(4n + 4) .card:hover { background: var(--card-4-hover); }
      .back {
        display: inline-block;
        margin-top: 40px;
        color: var(--label);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Labs</h1>
      <p class="intro">Projects and experiments.</p>
      <ul class="grid">
        <li>
          <a class="card" href="/rooms">
            <h2>Rooms</h2>
            <p>Floor plan with layout options.</p>
          </a>
        </li>
        <li>
          <a class="card" href="/rooms-3d">
            <h2>Rooms 3D</h2>
            <p>The floor plan in 3D, room by room.</p>
          </a>
        </li>
        <li>
          <a class="card" href="/cctv">
            <h2>CCTV</h2>
            <p>Home camera. Sign-in required.</p>
          </a>
        </li>
        <li>
          <a
            class="card"
            href="https://david-and-gaby-recipe-book.david232314.chatgpt.site/"
          >
            <h2>Recipe book</h2>
            <p>Our family recipe book.</p>
          </a>
        </li>
      </ul>
      <a class="back" href="/">Home</a>
    </main>
  </body>
</html>
